services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      PORT: 3000
      DATABASE_PATH: /data/app.db
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - backend-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
